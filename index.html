<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plate Identificator — CT221B</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f5f6f8;
    --border: #dde1e8;
    --accent: #e8920a;
    --accent2: #c97a00;
    --text: #1a1d24;
    --text-muted: #7a8099;
    --green: #16a34a;
    --red: #dc2626;
    --label-bg: #ffffff;
    --label-border: #333;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .logo {
    font-family: var(--sans);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .logo span {
    color: var(--text-muted);
    font-weight: 300;
  }

  .printer-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 2s infinite;
  }
  .status-dot.connected { background: var(--green); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* LAYOUT */
  .app {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
  }

  /* PANEL GAUCHE */
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 13px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.12);
  }

  select option { background: var(--surface2); }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* TOGGLE JOB */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .toggle {
    width: 38px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle::after {
    content: '';
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }

  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(18px); }

  .toggle-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  .job-fields {
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }

  .job-fields.visible { max-height: 200px; }

  /* PRESET MATIÈRES */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .preset-btn {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .preset-btn:hover, .preset-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* ACTIONS */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .btn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    padding: 13px 20px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover {
    background: #ffc04d;
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(245,166,35,0.35);
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-connect {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 9px;
  }

  .btn-connect:hover { border-color: var(--green); color: var(--green); }

  /* COPIES */
  .copies-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .copies-row label { min-width: fit-content; margin-bottom: 0; }

  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .qty-btn {
    background: var(--surface2);
    border: none;
    color: var(--text);
    width: 32px; height: 36px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s;
  }

  .qty-btn:hover { background: var(--border); }

  .qty-val {
    background: var(--bg);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 14px;
    width: 44px;
    text-align: center;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    outline: none;
  }

  /* PANNEAU DROIT — PREVIEW */
  .preview-pane {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 32px;
    position: relative;
    background: repeating-linear-gradient(
      45deg,
      #e8eaef,
      #e8eaef 10px,
      #dde0e8 10px,
      #dde0e8 20px
    );
  }

  .preview-label-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .preview-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ÉTIQUETTE 50x30mm — ratio: 5:3 */
  .label-preview {
    width: 400px;
    height: 240px;
    background: var(--label-bg);
    border: 2px solid var(--label-border);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    padding: 10px 14px 8px;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 0 0 8px rgba(0,0,0,0.04);
    overflow: hidden;
    transition: all 0.2s;
  }

  .label-preview::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #222;
  }

  /* Contenu étiquette */
  .lbl-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .lbl-job-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #222;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .lbl-job-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: #444;
    background: #f0f0f0;
    padding: 2px 8px;
    border-radius: 2px;
  }

  .lbl-divider {
    height: 1px;
    background: #ddd;
    margin: 4px 0;
  }

  .lbl-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .lbl-matiere {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    line-height: 1;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lbl-epaisseur {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    color: #444;
    margin-top: 3px;
    display: block;
  }

  .lbl-dimensions {
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lbl-dim-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #111;
    background: #f0f0f0;
    border: 1px solid #ddd;
    padding: 1px 8px;
    border-radius: 2px;
    letter-spacing: 0.5px;
  }

  .lbl-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    padding-top: 4px;
    border-top: 1px solid #eee;
  }

  .lbl-barcode {
    display: flex;
    gap: 1px;
    align-items: flex-end;
    height: 18px;
  }

  .lbl-barcode span {
    display: block;
    background: #333;
    width: 2px;
  }

  .lbl-serial {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: #aaa;
  }

  /* Taille indicateur */
  .size-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .size-ruler {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .ruler-line {
    height: 1px;
    background: var(--border);
    width: 80px;
    position: relative;
  }

  .ruler-line::before, .ruler-line::after {
    content: '';
    position: absolute;
    width: 1px; height: 6px;
    background: var(--border);
    top: -3px;
  }

  .ruler-line::before { left: 0; }
  .ruler-line::after { right: 0; }

  /* HISTORIQUE */
  .history-pane {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 280px;
  }

  .history-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
  }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .history-item:hover { border-color: var(--accent); }

  .history-item-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item-reprint {
    font-size: 10px;
    color: var(--accent);
    font-family: var(--mono);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #000;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 12px 28px;
    border-radius: 4px;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 100;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* PRINT */
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area {
      position: fixed;
      top: 0; left: 0;
      width: 50mm; height: 30mm;
    }
    .label-print {
      width: 50mm; height: 30mm;
      background: #fff;
      padding: 2mm 2.5mm;
      display: flex; flex-direction: column;
    }
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c8cdd8; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">Plate <span>Identificator</span></div>
  <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);">CT221B — ÉTIQUETTES 50×30mm</div>
  <div class="printer-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">IMPRIMANTE NON CONNECTÉE</span>
  </div>
</header>

<div class="app">

  <!-- PANEL GAUCHE -->
  <div class="panel">

    <!-- MATIÈRE -->
    <div>
      <div class="section-title">Matière</div>
      <div class="field-group">
        <div class="field">
          <label>NOM DE LA MATIÈRE</label>
          <input type="text" id="matiere" placeholder="ex: ALUMINIUM, PVC, INOX..." oninput="updatePreview()">
        </div>
        <div>
          <label style="display:block;margin-bottom:8px;">PRESET RAPIDE</label>
          <div class="presets" id="presets">
            <button class="preset-btn" onclick="setPreset(this,'DIBOND')">Dibond</button>
            <button class="preset-btn" onclick="setPreset(this,'PVC')">PVC</button>
            <button class="preset-btn" onclick="setPreset(this,'MDF')">MDF</button>
            <button class="preset-btn" onclick="setPreset(this,'PLEXIGLASS')">Plexiglass</button>
            <button class="preset-btn" onclick="setPreset(this,'BEELITE')">Beelite</button>
            <button class="preset-btn" onclick="setPreset(this,'POLYPRO ALVÉOLAIRE')">Polypro Alvéolaire</button>
            <button class="preset-btn" onclick="setPreset(this,'CARTON E-GOLF')">Carton E-Golf</button>
            <button class="preset-btn" onclick="setPreset(this,'PALBOARD')">Palboard</button>
            <button class="preset-btn" onclick="setPreset(this,'PAPIER')">Papier</button>
          </div>
        </div>
        <div class="field">
          <label>ÉPAISSEUR</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="epaisseur" placeholder="0" min="0" step="0.5" oninput="updatePreview()" style="flex:1;">
            <select id="unite" onchange="updatePreview()" style="width:80px;">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="µm">µm</option>
              <option value="in">in</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- DIMENSIONS PLAQUE -->
    <div>
      <div class="section-title">Dimensions de la plaque</div>
      <div class="field-group">
        <div class="row-2">
          <div class="field">
            <label>HAUTEUR (mm)</label>
            <input type="number" id="dimH" placeholder="0" min="0" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>LONGUEUR (mm)</label>
            <input type="number" id="dimLon" placeholder="0" min="0" oninput="updatePreview()">
          </div>
        </div>
        <div class="field">
          <label>UNITÉ DIMS</label>
          <select id="uniteD" onchange="updatePreview()">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="m">m</option>
            <option value="in">in</option>
          </select>
        </div>
      </div>
    </div>

    <!-- JOB (OPTIONNEL) -->
    <div>
      <div class="section-title">Job</div>
      <div class="toggle-row" onclick="toggleJob()">
        <div class="toggle" id="jobToggle"></div>
        <span class="toggle-label">Inclure les informations de job</span>
      </div>
      <div class="job-fields" id="jobFields" style="margin-top:14px;">
        <div class="field">
          <label>NOM DU JOB</label>
          <input type="text" id="jobName" placeholder="ex: FACADE OUEST" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>N° DE JOB</label>
          <input type="text" id="jobNum" placeholder="ex: JOB-2024-001" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- IMPRESSION -->
    <div class="actions">
      <div class="copies-row">
        <label>COPIES :</label>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeCopies(-1)">−</button>
          <div class="qty-val" id="copiesVal">1</div>
          <button class="qty-btn" onclick="changeCopies(1)">+</button>
        </div>
      </div>
      <button class="btn btn-connect" onclick="connectPrinter()">
        ⚡ CONNECTER IMPRIMANTE BLUETOOTH
      </button>
      <button class="btn btn-secondary" onclick="previewPrint()">
        🖨 APERÇU IMPRESSION
      </button>
      <button class="btn btn-primary" onclick="printLabel()">
        ▶ IMPRIMER L'ÉTIQUETTE
      </button>
    </div>

  </div>

  <!-- PANNEAU PREVIEW -->
  <div class="preview-pane">

    <div class="preview-label-wrapper">
      <div class="preview-hint">APERÇU ÉTIQUETTE — 50 × 30 mm</div>

      <div class="label-preview" id="labelPreview">
        <!-- Job info (optionnel) -->
        <div class="lbl-top" id="prevJobRow" style="display:none">
          <span class="lbl-job-name" id="prevJobName">—</span>
          <span class="lbl-job-num" id="prevJobNum">—</span>
        </div>
        <div class="lbl-divider" id="prevDivider" style="display:none"></div>

        <!-- Corps principal -->
        <div class="lbl-main">
          <div class="lbl-matiere" id="prevMatiere">MATIÈRE</div>
          <div class="lbl-epaisseur" id="prevEpaisseur">— mm</div>
          <div class="lbl-dimensions">
            <span class="lbl-dim-badge" id="prevDims">H × L</span>
          </div>
        </div>

        <!-- Bas de l'étiquette -->
        <div class="lbl-bottom">
          <div class="lbl-barcode" id="prevBarcode"></div>
          <div class="lbl-serial" id="prevSerial">CT221B • 50×30</div>
        </div>
      </div>

      <!-- Règles indicatives -->
      <div class="size-indicator">
        <div class="size-ruler">
          <div class="ruler-line" style="width:133px;"></div>
          <span>50 mm</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <div class="ruler-line" style="width:80px;"></div>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text-muted);">30 mm</span>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="history-pane">
      <div class="history-title">Historique</div>
      <div class="history-list" id="historyList">
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);padding:8px 0;">Aucune impression récente</div>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Zone print cachée -->
<div class="print-area" id="printArea" style="display:none;">
  <div class="label-print" id="labelPrintContent"></div>
</div>

<script>
  let copies = 1;
  let jobEnabled = false;
  let history = [];
  let printerConnected = false;

  // ——— BARCODE DÉCORATIF ———
  function generateBarcode() {
    const bc = document.getElementById('prevBarcode');
    bc.innerHTML = '';
    const heights = [14,10,14,8,12,14,10,14,8,10,14,12,8,14,10,14,12,10,14,8];
    heights.forEach(h => {
      const bar = document.createElement('span');
      bar.style.height = h + 'px';
      bc.appendChild(bar);
    });
  }

  // ——— UPDATE PREVIEW ———
  function updatePreview() {
    const mat = document.getElementById('matiere').value.toUpperCase() || 'MATIÈRE';
    const ep = document.getElementById('epaisseur').value;
    const unite = document.getElementById('unite').value;
    const l = document.getElementById('dimL') ? document.getElementById('dimL').value : '';
    const h = document.getElementById('dimH').value;
    const lon = document.getElementById('dimLon').value;
    const ud = document.getElementById('uniteD').value;
    const jName = document.getElementById('jobName').value.toUpperCase();
    const jNum = document.getElementById('jobNum').value.toUpperCase();

    // Matière & épaisseur
    document.getElementById('prevMatiere').textContent = mat;
    document.getElementById('prevEpaisseur').textContent = ep ? `${ep} ${unite}` : `— ${unite}`;

    // Dimensions
    let dimStr = '';
    if (h) dimStr += `H : ${h}`;
    if (lon) dimStr += (dimStr ? '  ×  ' : '') + `L : ${lon}`;
    if (dimStr) dimStr += ` ${ud}`;
    document.getElementById('prevDims').textContent = dimStr || 'L × H × e';

    // Job
    const showJob = jobEnabled && (jName || jNum);
    document.getElementById('prevJobRow').style.display = showJob ? 'flex' : 'none';
    document.getElementById('prevDivider').style.display = showJob ? 'block' : 'none';
    document.getElementById('prevJobName').textContent = jName || '—';
    document.getElementById('prevJobNum').textContent = jNum || '—';

    generateBarcode();
  }

  // ——— PRESET ———
  function setPreset(btn, val) {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('matiere').value = val;
    updatePreview();
  }

  // ——— TOGGLE JOB ———
  function toggleJob() {
    jobEnabled = !jobEnabled;
    document.getElementById('jobToggle').classList.toggle('on', jobEnabled);
    document.getElementById('jobFields').classList.toggle('visible', jobEnabled);
    updatePreview();
  }

  // ——— COPIES ———
  function changeCopies(d) {
    copies = Math.max(1, Math.min(99, copies + d));
    document.getElementById('copiesVal').textContent = copies;
  }

  // ——— BLE STATE ———
  let bleDevice = null;
  let bleChar = null;

  // Tous les UUID connus pour imprimantes CLabel / TSC / Zebra BLE
  const KNOWN_SERVICES = [
    '000018f0-0000-1000-8000-00805f9b34fb', // CLabel CT221B standard
    '00001101-0000-1000-8000-00805f9b34fb', // SPP classique
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2', // TSC série récente
    '49535343-fe7d-4ae5-8fa9-9fafd205e455', // Peripage / CLabel variante
    '000018f0-0000-1000-8000-00805f9b34fb',
  ];

  const KNOWN_CHARS = [
    '00002af1-0000-1000-8000-00805f9b34fb', // CLabel standard
    'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f', // TSC récent
    '49535343-8841-43f4-a8d4-ecbe34729bb3', // Peripage variante
    '00002af0-0000-1000-8000-00805f9b34fb',
  ];

  function logStatus(msg) {
    console.log('[BLE]', msg);
    document.getElementById('statusText').textContent = msg;
  }

  // ——— BLUETOOTH CONNECT ———
  async function connectPrinter() {
    if (!navigator.bluetooth) {
      showToast('❌ Web Bluetooth non dispo — utilisez Chrome Android');
      return;
    }
    try {
      logStatus('🔍 Sélection appareil...');
      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: KNOWN_SERVICES
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
      logStatus('🔗 Connexion GATT...');

      const server = await bleDevice.gatt.connect();
      logStatus('📋 Lecture des services...');

      // Lister tous les services disponibles
      let allServices = [];
      try {
        allServices = await server.getPrimaryServices();
        console.log('[BLE] Services trouvés:', allServices.map(s => s.uuid));
        logStatus(`🔎 ${allServices.length} service(s) trouvé(s)...`);
      } catch(e) {
        console.warn('[BLE] getPrimaryServices failed, essai UUID par UUID', e);
      }

      // Essai 1 : parcourir les services trouvés
      for (const svc of allServices) {
        try {
          const chars = await svc.getCharacteristics();
          console.log('[BLE] Service', svc.uuid, '→ chars:', chars.map(c => c.uuid));
          for (const c of chars) {
            if (c.properties.write || c.properties.writeWithoutResponse) {
              bleChar = c;
              console.log('[BLE] ✅ Char écriture trouvée:', c.uuid);
              break;
            }
          }
          if (bleChar) break;
        } catch(e) { console.warn('[BLE] Svc', svc.uuid, 'erreur:', e.message); }
      }

      // Essai 2 : forcer les UUID connus si rien trouvé
      if (!bleChar) {
        logStatus('🔎 Essai UUID connus...');
        for (const svcUuid of KNOWN_SERVICES) {
          try {
            const svc = await server.getPrimaryService(svcUuid);
            for (const charUuid of KNOWN_CHARS) {
              try {
                const c = await svc.getCharacteristic(charUuid);
                if (c.properties.write || c.properties.writeWithoutResponse) {
                  bleChar = c;
                  console.log('[BLE] ✅ Match UUID connu:', svcUuid, charUuid);
                  break;
                }
              } catch(e) {}
            }
            if (bleChar) break;
          } catch(e) {}
        }
      }

      if (!bleChar) {
        showToast('❌ Caractéristique écriture non trouvée — voir console');
        logStatus('❌ Char introuvable — imprimante incompatible ?');
        return;
      }

      printerConnected = true;
      document.getElementById('statusDot').classList.add('connected');
      logStatus(`✓ ${bleDevice.name || 'Imprimante'} connectée`);
      showToast('✅ Imprimante connectée !');

    } catch(e) {
      if (e.name === 'NotFoundError') { logStatus('IMPRIMANTE NON CONNECTÉE'); return; }
      console.error('[BLE] Erreur:', e);
      showToast('❌ ' + e.message);
      logStatus('❌ ' + e.message);
    }
  }

  function onDisconnected() {
    printerConnected = false;
    bleChar = null;
    document.getElementById('statusDot').classList.remove('connected');
    logStatus('IMPRIMANTE DÉCONNECTÉE');
    showToast('⚠ Imprimante déconnectée');
  }

  // ——— ENCODE TSC → Uint8Array ———
  function tscEncode(str) {
    const enc = new TextEncoder();
    return enc.encode(str);
  }

  // ——— ENVOYER EN CHUNKS (BLE MTU ~20 bytes) ———
  async function bleWriteChunked(data) {
    const CHUNK = 20;
    for (let i = 0; i < data.length; i += CHUNK) {
      const chunk = data.slice(i, i + CHUNK);
      await bleChar.writeValue(chunk);
      await new Promise(r => setTimeout(r, 30)); // petit délai entre chunks
    }
  }

  // ——— CONSTRUIRE COMMANDE TSC ———
  // Format étiquette : 50mm x 30mm, résolution 203dpi
  // 1mm = 8 dots @ 203dpi
  function buildTSC(mat, ep, unite, h, lon, ud, jName, jNum, qty) {
    // Dimensions en dots (203 dpi, 1mm ≈ 8 dots)
    const W = 400; // 50mm * 8
    const H = 240; // 30mm * 8
    const GAP = 24; // 3mm gap entre étiquettes

    let y = 10;
    let cmds = '';

    cmds += `SIZE 50 mm, 30 mm\r\n`;
    cmds += `GAP 3 mm, 0 mm\r\n`;
    cmds += `DIRECTION 0\r\n`;
    cmds += `CLS\r\n`;

    // Job (si activé)
    if (jName || jNum) {
      if (jName) {
        cmds += `TEXT 10,${y},"3",0,1,1,"${jName.toUpperCase()}"\r\n`;
      }
      if (jNum) {
        const xNum = jName ? 220 : 10;
        cmds += `TEXT ${xNum},${y},"3",0,1,1,"${jNum.toUpperCase()}"\r\n`;
      }
      y += 28;
      cmds += `BAR 10,${y},380,2\r\n`;
      y += 8;
    }

    // Matière (grande police)
    cmds += `TEXT 10,${y},"4",0,2,2,"${mat.toUpperCase()}"\r\n`;
    y += 44;

    // Épaisseur
    if (ep) {
      cmds += `TEXT 10,${y},"3",0,1,1,"EP: ${ep} ${unite}"\r\n`;
      y += 28;
    }

    // Dimensions
    if (h || lon) {
      let dimStr = '';
      if (h)   dimStr += `H:${h}`;
      if (lon) dimStr += (dimStr ? '  x  ' : '') + `L:${lon}`;
      if (dimStr) dimStr += ` ${ud}`;
      cmds += `TEXT 10,${y},"3",0,1,1,"${dimStr}"\r\n`;
      y += 28;
    }

    // Ligne de pied + petite info
    cmds += `BAR 10,210,380,1\r\n`;
    cmds += `TEXT 10,215,"1",0,1,1,"CT221B  50x30mm"\r\n`;

    cmds += `PRINT ${qty},1\r\n`;
    return cmds;
  }

  // ——— IMPRESSION BLE ———
  async function printLabel() {
    const mat = document.getElementById('matiere').value;
    if (!mat) { showToast('⚠ Entrez le nom de la matière'); return; }

    const ep    = document.getElementById('epaisseur').value;
    const unite = document.getElementById('unite').value;
    const h     = document.getElementById('dimH').value;
    const lon   = document.getElementById('dimLon').value;
    const ud    = document.getElementById('uniteD').value;
    const jName = jobEnabled ? document.getElementById('jobName').value : '';
    const jNum  = jobEnabled ? document.getElementById('jobNum').value  : '';

    addToHistory(mat, ep, unite);

    if (!printerConnected || !bleChar) {
      showToast('⚠ Connectez d\'abord l\'imprimante');
      return;
    }

    try {
      showToast(`🖨 Envoi × ${copies}...`);
      const tsc  = buildTSC(mat, ep, unite, h, lon, ud, jName, jNum, copies);
      const data = tscEncode(tsc);
      await bleWriteChunked(data);
      showToast(`✅ ${copies} étiquette(s) envoyée(s) !`);
    } catch(e) {
      console.error(e);
      showToast('❌ Erreur impression: ' + e.message);
    }
  }

  // ——— APERÇU VISUEL (fallback si pas connecté) ———
  function previewPrint() {
    const mat   = document.getElementById('matiere').value || 'MATIÈRE';
    const ep    = document.getElementById('epaisseur').value;
    const unite = document.getElementById('unite').value;
    const h     = document.getElementById('dimH').value;
    const lon   = document.getElementById('dimLon').value;
    const ud    = document.getElementById('uniteD').value;
    const jName = jobEnabled ? document.getElementById('jobName').value : '';
    const jNum  = jobEnabled ? document.getElementById('jobNum').value  : '';

    const win = window.open('', '_blank', 'width=340,height=260');
    win.document.write(`
      <html><head><title>Aperçu 50×30mm</title>
      <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
      <style>
        body{margin:0;padding:6mm;background:#ccc;display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .lbl{width:50mm;height:30mm;background:#fff;padding:2mm 2.5mm;box-sizing:border-box;
          font-family:'Barlow Condensed',sans-serif;border:1px solid #999;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.2);}
        .job{font-size:8pt;font-weight:700;color:#222;display:flex;justify-content:space-between;border-bottom:.3mm solid #ccc;padding-bottom:.8mm;margin-bottom:.8mm;}
        .mat{font-size:18pt;font-weight:900;color:#111;line-height:1;text-transform:uppercase;}
        .ep{font-family:'Share Tech Mono',monospace;font-size:10pt;color:#333;margin-top:.5mm;}
        .dims{font-family:'Barlow Condensed',sans-serif;font-size:10pt;font-weight:700;color:#111;background:#f0f0f0;padding:0 1.5mm;margin-top:.8mm;display:inline-block;}
        .foot{margin-top:auto;font-family:'Share Tech Mono',monospace;font-size:5.5pt;color:#aaa;border-top:.3mm solid #eee;padding-top:.8mm;}
      </style></head><body>
      <div class="lbl">
        ${(jName||jNum)?`<div class="job"><span>${jName.toUpperCase()}</span><span>${jNum.toUpperCase()}</span></div>`:''}
        <div class="mat">${mat.toUpperCase()}</div>
        ${ep ? `<div class="ep">ép. ${ep} ${unite}</div>` : ''}
        ${(h||lon) ? `<div class="dims">${h?'H:'+h:''} ${lon?'× L:'+lon:''} ${ud}</div>` : ''}
        <div class="foot">CT221B • 50×30mm</div>
      </div>
      </body></html>
    `);
    win.document.close();
    addToHistory(mat, ep, unite);
  }

  // ——— HISTORIQUE ———
  function addToHistory(mat, ep, unite) {
    const ts = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
    history.unshift({ mat, ep, unite, ts });
    if (history.length > 8) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (!history.length) {
      el.innerHTML = '<div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);padding:8px 0;">Aucune impression récente</div>';
      return;
    }
    el.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="reloadHistory(${i})">
        <div class="history-item-text">${h.mat} — ${h.ep||'?'} ${h.unite} • ${h.ts}</div>
        <span class="history-item-reprint">↩ recharger</span>
      </div>
    `).join('');
  }

  function reloadHistory(i) {
    const h = history[i];
    document.getElementById('matiere').value = h.mat;
    document.getElementById('epaisseur').value = h.ep;
    document.getElementById('unite').value = h.unite;
    updatePreview();
    showToast('↩ Données rechargées');
  }

  // ——— TOAST ———
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Init
  generateBarcode();
  updatePreview();
</script>
